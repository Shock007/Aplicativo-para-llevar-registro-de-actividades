<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar sesión · Registro de Actividades</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-banner"></div>
    <div class="auth-content">
      <div class="auth-eyebrow">MÓDULO / AUTENTICACIÓN</div>
      <h1 class="auth-title">Bienvenido de vuelta</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack">
            {% for category, message in messages %}
              <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST" class="auth-form">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" required autofocus placeholder="tucorreo@ejemplo.com">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Iniciar Sesión</button>
      </form>

      <p class="auth-switch">¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate aquí</a></p>
    </div>
  </div>
</body>
</html>
