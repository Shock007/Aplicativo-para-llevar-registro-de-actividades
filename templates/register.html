<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear cuenta · Registro de Actividades</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-banner"></div>
    <div class="auth-content">
      <div class="auth-eyebrow">MÓDULO / AUTENTICACIÓN</div>
      <h1 class="auth-title">Crear cuenta</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack">
            {% for category, message in messages %}
              <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST" class="auth-form">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" required autofocus placeholder="tucorreo@ejemplo.com">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required minlength="8" placeholder="Mínimo 8 caracteres">
        </div>
        <div class="field">
          <label for="confirm_password">Confirmar contraseña</label>
          <input type="password" id="confirm_password" name="confirm_password" required minlength="8" placeholder="Repite la contraseña">
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Crear cuenta</button>
      </form>

      <p class="auth-switch">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión aquí</a></p>
    </div>
  </div>
</body>
</html>
